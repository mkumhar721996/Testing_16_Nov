components:
  comp_platform_api:
    mode: local
    e2e_command: cd services/api && pnpm run e2e
    test_command: cd services/api && pnpm run test
    build_command: cd services/api && pnpm run build
    start_command: cd services/api && pnpm run build && HOST={host} PORT={port} pnpm
      run start
    devloop_command: cd services/api && pnpm run devloop
    port_env: COMP_PLATFORM_API_PORT
    base_port: 8080
    ready_check:
      url: http://localhost:{port}/
  comp_platform_worker:
    mode: local
    test_command: cd services/worker && pnpm run test
    build_command: cd services/worker && pnpm run build
    start_command: cd services/worker && pnpm exec tsx src/main.ts --host {host} --port
      {port}
    devloop_command: cd services/worker && pnpm run devloop
    port_env: COMP_PLATFORM_WORKER_PORT
    base_port: 8081
    ready_check:
      url: http://localhost:{port}/
  comp_web_app:
    mode: local
    e2e_command: cd apps/web && pnpm e2e
    test_command: cd apps/web && pnpm test
    build_command: cd apps/web && pnpm build
    start_command: cd apps/web && pnpm exec vite --host {host} --port {port} --strictPort
    devloop_command: cd apps/web && pnpm devloop
    port_env: COMP_WEB_APP_PORT
    base_port: 5173
    ready_check:
      url: http://localhost:{port}/
    primary: true
commands:
  test: (cd services/api && pnpm run test) && (cd services/worker && pnpm run test)
    && (cd apps/web && pnpm test)
  build: (cd services/api && pnpm run build) && (cd services/worker && pnpm run build)
    && (cd apps/web && pnpm build)
  devloop: (cd services/api && pnpm run devloop) && (cd services/worker && pnpm run
    devloop) && (cd apps/web && pnpm devloop)
setup_command: (cd apps/web && pnpm install --frozen-lockfile) && (cd services/api
  && pnpm install --frozen-lockfile) && (cd services/worker && pnpm install --frozen-lockfile)
toolchain:
  node: '22'
  pnpm: 12.9.1
